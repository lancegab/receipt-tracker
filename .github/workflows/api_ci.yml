name: API CI

on:
  push:
    branches: [main]
    paths:
      - 'expense-tracker-api/**'
  pull_request:
    branches: [main]
    paths:
      - 'expense-tracker-api/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expense-tracker-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: expense-tracker-api/package-lock.json
      - run: npm install
      - run: npx tsc --noEmit
