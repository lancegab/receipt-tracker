name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'expense_tracker_app/**'
  pull_request:
    branches: [main]
    paths:
      - 'expense_tracker_app/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expense_tracker_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - run: flutter build apk --debug
      - run: flutter build ios --debug --no-codesign
